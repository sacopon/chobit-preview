name: Validate Pages sync workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/sync_pages.py
      - .github/workflows/sync-pages.yml
      - .github/workflows/validate-sync-pages.yml

  push:
    branches:
      - main
    paths:
      - .github/scripts/sync_pages.py
      - .github/workflows/sync-pages.yml
      - .github/workflows/validate-sync-pages.yml

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check Python syntax
        run: |
          python3 -m py_compile .github/scripts/sync_pages.py
